<!DOCTYPE html>
<html lang="en" class="h-full">
 <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSI Model — Interactive Exploration</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --void:#030508;--deep:#06090f;--panel:#0b1019;
  --b1:#0d1825;--b2:#162638;--b3:#1e3450;
  --cyan:#00e5ff;--green:#3dff9a;--pink:#ff3ea5;--amber:#ffaa00;--blue:#4d8fff;
  --text:#c2d8ef;--dim:#3a5a72;--bright:#eaf4ff;
  --l7:#ff3ea5;--l6:#bf4dff;--l5:#4d7fff;
  --l4:#00e5ff;--l3:#3dff9a;--l2:#aaff33;--l1:#ffaa00;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--void);font-family:'IBM Plex Sans',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden;font-size:15px;line-height:1.5}
#bg{position:fixed;inset:0;z-index:0}
.scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 3px)}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 120% 100% at 50% 50%,transparent 35%,rgba(3,5,8,.9) 100%)}
.app{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--b2);flex-wrap:wrap;gap:12px;background:linear-gradient(180deg,rgba(0,229,255,.02),transparent);position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:5%;right:5%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--green),transparent);opacity:.3}
.brand{display:flex;align-items:center;gap:10px}
.brand-ico{width:32px;height:32px;border:1.5px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--cyan);position:relative;flex-shrink:0}
.brand-ico::before,.brand-ico::after{content:'';position:absolute;width:5px;height:5px;border:1px solid var(--cyan)}
.brand-ico::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.brand-ico::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.brand-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem}
.brand-name em{color:var(--cyan);font-style:normal}
.brand-sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--dim);display:block;margin-top:2px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:1.5px;padding:7px 16px;border:1px solid;background:transparent;cursor:pointer;text-transform:uppercase;transition:all .16s;clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.b-quiz{color:var(--amber);border-color:var(--amber)}
.b-quiz:hover{background:var(--amber);color:var(--void);box-shadow:0 0 20px var(--amber)}
.b-reset{color:var(--dim);border-color:var(--dim)}
.b-reset:hover{color:var(--text);border-color:var(--text)}
.btn:disabled{opacity:.28;cursor:not-allowed}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--b2);background:var(--deep)}
.tab{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;padding:10px 20px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;transition:all .2s;text-transform:uppercase;border-right:1px solid var(--b1)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);background:rgba(0,229,255,.03)}
.body{flex:1;display:grid;grid-template-columns:1fr 300px;gap:0}
.left-col{padding:20px 24px 20px 28px;overflow-y:auto;font-size:17px}
.left-col::-webkit-scrollbar{width:3px}.left-col::-webkit-scrollbar-thumb{background:var(--b2)}
.mc{display:flex;flex-direction:column;gap:2px}
.mc-hdr{text-align:center;padding:10px 12px;margin-bottom:6px;border:1px solid var(--b2);background:rgba(0,229,255,.02);font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2.5px;color:var(--cyan);position:relative}
.mc-hdr::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.3}
.lyr{position:relative;padding:8px 10px;border:1px solid var(--b1);cursor:pointer;transition:transform .22s,box-shadow .22s,background .22s,border-color .22s;display:flex;align-items:center;gap:8px;min-height:48px;overflow:hidden;background:var(--deep);margin-bottom:3px;border-radius:4px}
.lyr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;opacity:.5}
.lyr[data-n="7"]{border-color:rgba(255,62,165,.12)}.lyr[data-n="7"]::before{background:var(--l7);box-shadow:0 0 7px var(--l7)}
.lyr[data-n="6"]{border-color:rgba(191,77,255,.12)}.lyr[data-n="6"]::before{background:var(--l6);box-shadow:0 0 7px var(--l6)}
.lyr[data-n="5"]{border-color:rgba(77,127,255,.12)}.lyr[data-n="5"]::before{background:var(--l5);box-shadow:0 0 7px var(--l5)}
.lyr[data-n="4"]{border-color:rgba(0,229,255,.12)}.lyr[data-n="4"]::before{background:var(--l4);box-shadow:0 0 7px var(--l4)}
.lyr[data-n="3"]{border-color:rgba(61,255,154,.12)}.lyr[data-n="3"]::before{background:var(--l3);box-shadow:0 0 7px var(--l3)}
.lyr[data-n="2"]{border-color:rgba(170,255,51,.12)}.lyr[data-n="2"]::before{background:var(--l2);box-shadow:0 0 7px var(--l2)}
.lyr[data-n="1"]{border-color:rgba(255,170,0,.12)}.lyr[data-n="1"]::before{background:var(--l1);box-shadow:0 0 7px var(--l1)}
.lyr.active{transform:translateX(4px);z-index:10}
.lyr[data-n="7"].active{border-color:var(--l7);background:rgba(255,62,165,.08);box-shadow:0 0 20px rgba(255,62,165,.1)}
.lyr[data-n="6"].active{border-color:var(--l6);background:rgba(191,77,255,.08);box-shadow:0 0 20px rgba(191,77,255,.1)}
.lyr[data-n="5"].active{border-color:var(--l5);background:rgba(77,127,255,.08);box-shadow:0 0 20px rgba(77,127,255,.1)}
.lyr[data-n="4"].active{border-color:var(--l4);background:rgba(0,229,255,.08);box-shadow:0 0 20px rgba(0,229,255,.1)}
.lyr[data-n="3"].active{border-color:var(--l3);background:rgba(61,255,154,.08);box-shadow:0 0 20px rgba(61,255,154,.1)}
.lyr[data-n="2"].active{border-color:var(--l2);background:rgba(170,255,51,.08);box-shadow:0 0 20px rgba(170,255,51,.1)}
.lyr[data-n="1"].active{border-color:var(--l1);background:rgba(255,170,0,.08);box-shadow:0 0 20px rgba(255,170,0,.1)}
.ln{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;min-width:24px;text-align:center;opacity:.18;transition:opacity .25s;line-height:1;flex-shrink:0}
.lyr.active .ln{opacity:1}
.lb{flex:1;min-width:0}
.lname{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.lrole{font-size:8px;color:var(--dim);margin-top:2px;font-family:'JetBrains Mono',monospace;letter-spacing:.2px;line-height:1.2}
.lpdu{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;padding:3px 7px;border:1px solid;letter-spacing:.8px;text-transform:uppercase;opacity:.3;transition:opacity .25s;flex-shrink:0;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%);margin-left:auto}
.lyr.active .lpdu{opacity:1}
.right{border-left:1px solid var(--b2);display:flex;flex-direction:column;overflow-y:auto;max-height:calc(100vh - 110px)}
.right::-webkit-scrollbar{width:3px}.right::-webkit-scrollbar-thumb{background:var(--b2)}
.panel{border-bottom:1px solid var(--b1);padding:16px 18px;margin-bottom:0}
.ptitle{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.ptitle::before{content:'//';color:var(--cyan);opacity:.4}
.det-empty{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);text-align:center;padding:28px 0;line-height:2.2}
.det-wrap{display:none}.det-wrap.show{display:block}
.det-name{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.det-desc{font-size:17px;line-height:1.85;color:var(--text);margin:16px 0}
.det-section{margin-top:15px}
.det-stitle{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--b1)}
.analogy-box{background:rgba(0,229,255,.03);border:1px solid rgba(0,229,255,.12);padding:10px 12px;margin:10px 0;position:relative}
.analogy-box::before{content:'REAL-WORLD';position:absolute;top:-7px;left:10px;font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:2px;color:var(--cyan);background:var(--panel);padding:0 5px}
.analogy-text{font-size:15px;line-height:1.8;color:var(--text);font-style:italic}
.fact-box{background:rgba(61,255,154,.03);border:1px solid rgba(61,255,154,.12);padding:10px 12px;margin:10px 0;position:relative}
.fact-box::before{content:'KEY POINT';position:absolute;top:-7px;left:10px;font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:2px;color:var(--green);background:var(--panel);padding:0 5px}
.ptags{display:flex;flex-wrap:wrap;gap:3px}
.ptag{font-family:'JetBrains Mono',monospace;font-size:9px;padding:3px 8px;border:1px solid;clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%);cursor:default;transition:filter .15s}
.ptag:hover{filter:brightness(1.6)}
.quiz-overlay{position:fixed;inset:0;z-index:500;background:rgba(3,5,8,.95);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:30px}
.quiz-overlay.show{display:flex}
.quiz-card{max-width:560px;width:100%;border:1px solid var(--b3);background:var(--deep);padding:28px;position:relative}
.quiz-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cyan),var(--green))}
.q-num{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--dim);margin-bottom:14px}
.q-text{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;line-height:1.5;margin-bottom:20px;color:var(--bright)}
.q-opts{display:flex;flex-direction:column;gap:6px}
.q-opt{padding:10px 14px;border:1px solid var(--b2);background:transparent;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--text);text-align:left;transition:all .15s;display:flex;align-items:center;gap:10px}
.q-opt:hover{border-color:var(--cyan);color:var(--bright)}
.q-opt.correct{border-color:var(--green);background:rgba(61,255,154,.08);color:var(--green)}
.q-opt.wrong{border-color:var(--pink);background:rgba(255,62,165,.08);color:var(--pink)}
.q-opt-key{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;width:18px;height:18px;border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.q-opt:hover .q-opt-key{border-color:var(--cyan);color:var(--cyan)}
.q-explain{margin-top:14px;padding:10px 14px;background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.15);font-size:11px;line-height:1.65;display:none}
.q-explain.show{display:block}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.q-score{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim)}
.quiz-result{text-align:center;padding:20px 0}
.qr-score{font-family:'Syne',sans-serif;font-weight:800;font-size:3rem;margin:10px 0}
.qr-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
.qr-msg{font-size:12px;margin:12px 0;line-height:1.7;color:var(--text)}
.statusbar{grid-column:1/-1;padding:8px 24px;border-top:1px solid var(--b1);display:flex;align-items:center;gap:11px;font-family:'JetBrains Mono',monospace;font-size:9px;flex-wrap:wrap;background:rgba(6,9,15,.9)}
.led{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.led-idle{background:var(--dim)}
.st-txt{color:var(--dim)}.st-txt b{color:var(--bright)}
.tab-content{display:none}
.tab-content.active{display:block}
@media(max-width:860px){.body{grid-template-columns:1fr}.right{border-left:none;border-top:1px solid var(--b2);max-height:none}}
</style>
 </head>
 <body>
<canvas id="bg"></canvas>
<div class="scan"></div>
<div class="vig"></div>

<!-- QUIZ OVERLAY -->
<div class="quiz-overlay" id="quiz">
  <div class="quiz-card" id="qcard"></div>
</div>

<div class="app">
<header class="hdr">
  <div class="brand">
    <div class="brand-ico">◆</div>
    <div>
      <div class="brand-name"><em>OSI</em> Model</div>
      <div class="brand-sub">Interactive Explorer</div>
    </div>
  </div>
  <div class="hdr-right">
    <button class="btn b-quiz" id="btn-quiz">QUIZ</button>
    <button class="btn b-reset" id="btn-reset">RESET</button>
  </div>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="explore">Explore</div>
  <div class="tab" data-tab="reference">Reference</div>
  <div class="tab" data-tab="comparison">OSI vs TCP/IP</div>
</div>

<div class="body">
  <div class="left-col" id="left-col" style="border-right:1px solid var(--b1);">
    <div class="panel" style="border:none;padding:16px 24px;margin:0;">
      <div class="ptitle" style="margin-bottom:12px;">Layer Details</div>
      <div id="det-empty" class="det-empty">Select a layer to explore</div>
      <div id="det-wrap" class="det-wrap"></div>
    </div>
  </div>

  <div class="right" style="border-left:0;border-right:none;overflow-y:auto;max-height:calc(100vh - 110px);">
    <div id="explore-tab" class="tab-content active">
      <div class="mc" style="padding:12px;">
        <div class="mc-hdr" style="font-size:8px;padding:8px;">Layers</div>
        <div id="layer-list"></div>
      </div>
    </div>

    <div id="reference-tab" class="tab-content" style="padding:12px;">
      <div id="ref-content"></div>
    </div>

    <div id="comparison-tab" class="tab-content" style="padding:12px;">
      <div id="comp-content"></div>
    </div>

    <div class="panel" style="border-top:1px solid var(--b1);padding:10px 14px;">
      <div class="ptitle" style="margin-bottom:8px;font-size:8px;">Mnemonic</div>
      <p style="font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--green);line-height:1.5;margin:0;">
        <strong style="color:var(--cyan);">Send:</strong> APSTNDP<br>
        <strong style="color:var(--cyan);">Recv:</strong> PDNTSPA
      </p>
    </div>
  </div>

  <div class="statusbar">
    <div class="led led-idle" id="led"></div>
    <div class="st-txt" id="stxt">Ready to explore</div>
  </div>
</div>
</div>
<script>
// ════════════════ LAYER DATA ════════════════
const LAYERS = [
  {
    n: 7, name: 'Application Layer', color: '#ff3ea5', dataUnit: 'Data',
    description: 'The Application layer is the closest to the end user. It provides network services directly to user applications.',
    summary: 'User-facing layer that provides services like email, web browsing, and file transfer through protocols like HTTP and SMTP.',
    functions: [
      'Provides user interface for network services',
      'Handles high-level protocols for resource sharing',
      'Manages network transparency and access',
      'Supports email, file transfer, and web browsing'
    ],
    protocols: ['HTTP', 'HTTPS', 'FTP', 'SMTP', 'DNS', 'DHCP', 'SSH', 'Telnet', 'SNMP'],
    devices: ['Computers', 'Servers', 'Mobile Devices', 'IoT Devices'],
    realExample: 'When you open a web browser and type a URL, the Application layer processes your request using HTTP/HTTPS protocols.',
    icon: '🌐'
  },
  {
    n: 6, name: 'Presentation Layer', color: '#bf4dff', dataUnit: 'Data',
    description: 'The Presentation layer acts as a translator. It handles data formatting, encryption, and compression.',
    summary: 'Translator layer that handles data formatting, encryption, decryption, and compression for secure transmission.',
    functions: [
      'Data translation and format conversion',
      'Data encryption and decryption',
      'Data compression and decompression',
      'Character code translation (ASCII, EBCDIC)'
    ],
    protocols: ['SSL/TLS', 'JPEG', 'GIF', 'PNG', 'MPEG', 'ASCII', 'MIME'],
    devices: ['Gateway', 'Encryption Devices'],
    realExample: 'When you access a secure website (HTTPS), this layer encrypts your data using SSL/TLS before transmission.',
    icon: '🔐'
  },
  {
    n: 5, name: 'Session Layer', color: '#4d7fff', dataUnit: 'Data',
    description: 'The Session layer establishes, manages, and terminates connections between applications.',
    summary: 'Manages conversations between applications, establishing, maintaining, and terminating connections with synchronization.',
    functions: [
      'Session establishment and maintenance',
      'Session termination and recovery',
      'Synchronization with checkpoints',
      'Dialog control (simplex, half-duplex, full-duplex)'
    ],
    protocols: ['NetBIOS', 'RPC', 'PPTP', 'SAP', 'SDP', 'NFS'],
    devices: ['Gateway'],
    realExample: 'During a video call, the Session layer maintains your connection and can recover if interrupted.',
    icon: '🤝'
  },
  {
    n: 4, name: 'Transport Layer', color: '#00e5ff', dataUnit: 'Segments',
    description: 'The Transport layer ensures complete data transfer with error recovery and provides end-to-end communication control.',
    summary: 'Ensures reliable or fast data delivery using TCP or UDP, handling segmentation, error checking, and flow control.',
    functions: [
      'Segmentation and reassembly of data',
      'Error detection and correction',
      'Flow control to prevent overflow',
      'Connection-oriented (TCP) or connectionless (UDP) service'
    ],
    protocols: ['TCP', 'UDP', 'SCTP', 'DCCP'],
    devices: ['Firewall', 'Load Balancer'],
    realExample: 'When downloading a file, TCP ensures all packets arrive correctly and in order. For live streaming, UDP is used for speed.',
    icon: '📦'
  },
  {
    n: 3, name: 'Network Layer', color: '#3dff9a', dataUnit: 'Packets',
    description: 'The Network layer handles logical addressing and routing. It determines the best path for data to travel.',
    summary: 'Routes packets between networks using IP addresses and determines the best path for data across the internet.',
    functions: [
      'Logical addressing (IP addresses)',
      'Routing packets between networks',
      'Path determination and selection',
      'Packet forwarding and fragmentation'
    ],
    protocols: ['IP (IPv4/IPv6)', 'ICMP', 'OSPF', 'BGP', 'RIP', 'ARP', 'IPSec'],
    devices: ['Router', 'Layer 3 Switch', 'Firewall'],
    realExample: 'When you send an email, routers use IP addresses to determine the best path for your data across the internet.',
    icon: '🗺️'
  },
  {
    n: 2, name: 'Data Link Layer', color: '#aaff33', dataUnit: 'Frames',
    description: 'The Data Link layer provides node-to-node data transfer and handles error correction.',
    summary: 'Handles node-to-node communication using MAC addresses, creates frames with error detection, and controls media access.',
    functions: [
      'Frame creation and synchronization',
      'Physical addressing (MAC addresses)',
      'Error detection (CRC checks)',
      'Media access control (CSMA/CD)'
    ],
    protocols: ['Ethernet', 'Wi-Fi (802.11)', 'PPP', 'HDLC', 'Frame Relay', 'ATM'],
    devices: ['Switch', 'Bridge', 'NIC (Network Interface Card)', 'Access Point'],
    realExample: 'Your Wi-Fi router uses MAC addresses to direct data frames to the correct device on your local network.',
    icon: '🔗'
  },
  {
    n: 1, name: 'Physical Layer', color: '#ffaa00', dataUnit: 'Bits',
    description: 'The Physical layer deals with the physical connection and transmission of raw binary data.',
    summary: 'Transmits raw bits over physical media like cables, wires, and wireless signals with modulation and synchronization.',
    functions: [
      'Bit-by-bit transmission',
      'Physical topology definition',
      'Transmission mode (simplex, duplex)',
      'Signal encoding and modulation'
    ],
    protocols: ['Ethernet Physical', 'USB', 'Bluetooth', 'DSL', 'ISDN', '802.11 Physical'],
    devices: ['Hub', 'Repeater', 'Modem', 'Cables', 'Connectors'],
    realExample: 'The ethernet cable connecting your computer to a router operates at this layer, transmitting electrical signals.',
    icon: '⚡'
  }
];

const QUIZ_QUESTIONS = [
  {
    q: 'Which layer is responsible for routing?',
    opts: ['Application (7)', 'Transport (4)', 'Network (3)', 'Physical (1)'],
    ans: 2,
    exp: 'The Network layer (Layer 3) handles routing and logical addressing using IP addresses.'
  },
  {
    q: 'What data unit is used at the Transport Layer?',
    opts: ['Frames', 'Packets', 'Segments', 'Bits'],
    ans: 2,
    exp: 'The Transport layer (Layer 4) works with Segments when using TCP.'
  },
  {
    q: 'Which layer handles encryption and decryption?',
    opts: ['Session (5)', 'Presentation (6)', 'Data Link (2)', 'Physical (1)'],
    ans: 1,
    exp: 'The Presentation layer (Layer 6) handles encryption, decryption, compression, and data translation.'
  },
  {
    q: 'What is the primary function of the Physical Layer?',
    opts: ['Routing', 'Bit transmission', 'Session management', 'Data formatting'],
    ans: 1,
    exp: 'The Physical layer (Layer 1) handles raw bit transmission over physical media like cables.'
  },
  {
    q: 'Which layer is closest to the user?',
    opts: ['Session (5)', 'Application (7)', 'Presentation (6)', 'Transport (4)'],
    ans: 1,
    exp: 'The Application layer (Layer 7) is the topmost layer and directly interacts with user applications.'
  }
];

// ════════════════ CANVAS BACKGROUND ════════════════
(function(){
  const c=document.getElementById('bg'),ctx=c.getContext('2d');
  let W,H;
  const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:.15+Math.random()*.6,a:Math.random(),sp:.001+Math.random()*.003,ph:Math.random()*Math.PI*2}));
  function sz(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}sz();window.addEventListener('resize',sz);
  let t=0;
  function draw(){
    ctx.fillStyle='#030508';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3dff9a';stars.forEach(s=>{s.a+=(Math.sin(t*s.sp+s.ph)*.5+.5)*.005;ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill()});
    ctx.globalAlpha=1;
    t++;requestAnimationFrame(draw);
  }draw();
})();

function buildLayers(){
  const list=document.getElementById('layer-list');
  list.innerHTML='';
  LAYERS.forEach(l=>{
    const lyr=document.createElement('div');
    lyr.className='lyr';
    lyr.dataset.n=l.n;
    lyr.innerHTML=`
      <div class="ln">${l.n}</div>
      <div class="lb">
        <div class="lname">${l.name}</div>
        <div class="lrole">${l.dataUnit} Unit</div>
      </div>
      <div class="lpdu">${l.icon}</div>
    `;
    lyr.style.setProperty('--color',l.color);
    lyr.addEventListener('click',()=>showDetail(l));
    list.appendChild(lyr);
  });
}

function showDetail(l){
  document.getElementById('det-empty').style.display='none';
  const dw=document.getElementById('det-wrap');
  dw.classList.add('show');
  
  const colorVar=l.color;
  dw.innerHTML=`
    <div class="det-name">
      <span>${l.icon}</span>
      <span>Layer ${l.n}</span>
    </div>
    <div style="word-break:break-word;">${l.name}</div>
    <div class="det-desc">${l.description}</div>
    
    <div class="fact-box">
      <div style="font-size:15px;line-height:1.75;color:var(--green);">${l.summary}</div>
    </div>
    
    <div class="det-section">
      <div class="det-stitle">Key Functions</div>
      <ul style="list-style:none;margin:0;padding:0;">
        ${l.functions.map(f=>`<li style="display:flex;gap:8px;margin-bottom:8px;font-size:18px;line-height:1.6;"><span style="color:${colorVar};flex-shrink:0;margin-top:2px;">×</span><span>${f}</span></li>`).join('')}
      </ul>
    </div>
    
    <div class="det-section">
      <div class="det-stitle">Protocols</div>
      <div class="ptags">
        ${l.protocols.map(p=>`<span class="ptag" style="color:${colorVar};border-color:${colorVar}35">${p}</span>`).join('')}
      </div>
    </div>
    
    <div class="det-section">
      <div class="det-stitle">Devices</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;">
        ${l.devices.map(d=>`<span style="padding:4px 8px;background:rgba(255,255,255,.05);border:1px solid var(--b2);font-size:10px;border-radius:2px;">${d}</span>`).join('')}
      </div>
    </div>
    
    <div class="analogy-box">
      <div class="analogy-text">${l.realExample}</div>
    </div>
  `;
  
  document.querySelectorAll('.lyr').forEach(e=>e.classList.remove('active'));
  document.querySelector(`[data-n="${l.n}"]`).classList.add('active');
}

function buildReference(){
  const rc=document.getElementById('ref-content');
  rc.innerHTML=`
    <div style="padding:10px 0;">
      <h2 style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;color:var(--cyan);">OSI Model Reference</h2>
      ${LAYERS.map(l=>`
        <div style="margin-bottom:16px;padding:12px;border:1px solid var(--b2);border-radius:4px;background:rgba(0,229,255,.02);cursor:pointer;" onclick="showDetail(LAYERS.find(x=>x.n===${l.n}))">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <strong style="color:${l.color};">L${l.n}: ${l.name}</strong>
            <span style="font-size:11px;color:var(--dim);">${l.dataUnit}</span>
          </div>
          <p style="font-size:11px;color:var(--text);margin:0;">${l.description.substring(0,80)}...</p>
        </div>
      `).join('')}
    </div>
  `;
}

function buildComparison(){
  const cc=document.getElementById('comp-content');
  const tcpip=[
    {name:'Application',examples:['HTTP/HTTPS','FTP','SMTP','DNS','SSH']},
    {name:'Transport',examples:['TCP','UDP']},
    {name:'Internet',examples:['IP','ICMP','BGP']},
    {name:'Link',examples:['Ethernet','Wi-Fi','PPP']}
  ];
  cc.innerHTML=`
    <div style="padding:10px 0;">
      <h2 style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;color:var(--green);">OSI vs TCP/IP Model</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <h3 style="font-size:11px;color:var(--cyan);margin-bottom:10px;font-weight:700;text-transform:uppercase;">OSI (7 Layers)</h3>
          ${LAYERS.map(l=>`<div style="padding:6px;border-left:3px solid ${l.color};margin-bottom:4px;background:rgba(77,127,255,.03);">
            <strong style="font-size:10px;color:${l.color};">L${l.n}</strong><div style="font-size:9px;color:var(--dim);">${l.name}</div>
          </div>`).join('')}
        </div>
        <div>
          <h3 style="font-size:11px;color:var(--green);margin-bottom:10px;font-weight:700;text-transform:uppercase;">TCP/IP (4 Layers)</h3>
          ${tcpip.map(t=>`<div style="padding:8px;border:1px solid var(--green)35;background:rgba(61,255,154,.03);margin-bottom:8px;border-radius:3px;">
            <strong style="font-size:10px;color:var(--green);">${t.name}</strong>
            <div style="font-size:8px;color:var(--dim);margin-top:4px;">${t.examples.join(', ')}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="fact-box" style="margin-top:16px;">
        <div class="fact-text">The TCP/IP model is a practical implementation that combines some OSI layers. Most modern networks use TCP/IP, but the OSI model is invaluable for understanding network architecture.</div>
      </div>
    </div>
  `;
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.querySelector(`[data-tab="${name}"]`).classList.add('active');
  document.getElementById(`${name}-tab`).classList.add('active');
  if(name==='reference')buildReference();
  if(name==='comparison')buildComparison();
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchTab(t.dataset.tab)));

let qi=0,score=0,answered=false;

function startQuiz(){
  qi=0;score=0;answered=false;
  document.getElementById('quiz').classList.add('show');
  showQuestion();
}

function showQuestion(){
  if(qi>=QUIZ_QUESTIONS.length){
    showResult();
    return;
  }
  answered=false;
  const q=QUIZ_QUESTIONS[qi];
  const qcard=document.getElementById('qcard');
  qcard.innerHTML=`
    <div class="q-num">Q${qi+1}/${QUIZ_QUESTIONS.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="q-opts">
      ${q.opts.map((opt,i)=>`
        <div class="q-opt" onclick="answerQ(${i})">
          <span class="q-opt-key">${String.fromCharCode(65+i)}</span>
          <span>${opt}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function answerQ(i){
  if(answered)return;
  answered=true;
  const q=QUIZ_QUESTIONS[qi];
  const opts=document.querySelectorAll('.q-opt');
  opts[i].classList.add(i===q.ans?'correct':'wrong');
  opts[q.ans].classList.add('correct');
  if(i===q.ans)score++;
  
  const card=document.getElementById('qcard');
  const exp=document.createElement('div');
  exp.className='q-explain show';
  exp.textContent=q.exp;
  card.appendChild(exp);
  
  const nav=document.createElement('div');
  nav.className='q-nav';
  nav.innerHTML=`
    <span class="q-score">${score}/${qi+1}</span>
    <button class="btn b-go" onclick="qi++;showQuestion()">${qi+1===QUIZ_QUESTIONS.length?'Finish':'Next'}</button>
  `;
  card.appendChild(nav);
}

function showResult(){
  const qcard=document.getElementById('qcard');
  const pct=Math.round((score/QUIZ_QUESTIONS.length)*100);
  qcard.innerHTML=`
    <div class="quiz-result">
      <div class="qr-label">Quiz Complete</div>
      <div class="qr-score">${score}/${QUIZ_QUESTIONS.length}</div>
      <div class="qr-msg">${pct>=80?'Excellent understanding!':pct>=60?'Good knowledge!':'Keep learning!'}</div>
      <button class="btn b-go" style="margin-top:14px;" onclick="document.getElementById('quiz').classList.remove('show')">Close</button>
    </div>
  `;
}

document.getElementById('btn-quiz').addEventListener('click',startQuiz);
document.getElementById('btn-reset').addEventListener('click',()=>{
  document.querySelectorAll('.lyr').forEach(e=>e.classList.remove('active'));
  document.getElementById('det-empty').style.display='block';
  document.getElementById('det-wrap').classList.remove('show');
});

buildLayers();
buildReference();
buildComparison();
</script>
 </body>
</html>
